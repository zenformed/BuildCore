<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" fill="none" role="img" aria-labelledby="title">
  <title id="title">Select spreadsheet worksheets illustration</title>
  <defs>
    <linearGradient id="ssBgGlow" x1="70" y1="30" x2="410" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ssCardGrad" x1="140" y1="60" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="ssSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="480" height="400" rx="32" fill="url(#ssBgGlow)"/>
  <circle cx="400" cy="78" r="46" fill="#2563EB" fill-opacity="0.08"/>
  <circle cx="72" cy="318" r="34" fill="#0EA5E9" fill-opacity="0.1"/>

  <!-- Back sheet (offset stack) -->
  <g filter="url(#ssSoftShadow)" opacity="0.55">
    <rect x="148" y="78" width="220" height="168" rx="14" fill="#E2E8F0" stroke="#CBD5E1"/>
  </g>
  <g filter="url(#ssSoftShadow)" opacity="0.75">
    <rect x="138" y="90" width="220" height="168" rx="14" fill="#F1F5F9" stroke="#E2E8F0"/>
  </g>

  <!-- Front workbook with tabs -->
  <g filter="url(#ssSoftShadow)">
    <rect x="128" y="102" width="220" height="176" rx="14" fill="url(#ssCardGrad)" stroke="#E2E8F0"/>
    <rect x="128" y="102" width="220" height="36" rx="14" fill="#2563EB"/>
    <rect x="128" y="122" width="220" height="16" fill="#2563EB"/>
    <text x="148" y="126" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600">Workbook.xlsx</text>

    <!-- Sheet tabs -->
    <rect x="140" y="148" width="52" height="22" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="150" y="163" fill="#1D4ED8" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">2201</text>
    <rect x="198" y="148" width="52" height="22" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="208" y="163" fill="#1D4ED8" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">2202</text>
    <rect x="256" y="148" width="52" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="266" y="163" fill="#64748B" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600">2203</text>

    <!-- Mini grid -->
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="140" y1="188" x2="336" y2="188"/>
      <line x1="140" y1="214" x2="336" y2="214"/>
      <line x1="140" y1="240" x2="336" y2="240"/>
      <line x1="188" y1="172" x2="188" y2="262"/>
      <line x1="248" y1="172" x2="248" y2="262"/>
      <line x1="300" y1="172" x2="300" y2="262"/>
    </g>
    <rect x="148" y="176" width="28" height="8" rx="2" fill="#93C5FD"/>
    <rect x="198" y="176" width="36" height="8" rx="2" fill="#BFDBFE"/>
    <rect x="258" y="176" width="28" height="8" rx="2" fill="#BFDBFE"/>
    <rect x="310" y="176" width="20" height="8" rx="2" fill="#BFDBFE"/>
    <rect x="148" y="198" width="28" height="7" rx="2" fill="#CBD5E1"/>
    <rect x="198" y="198" width="40" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="258" y="198" width="24" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="310" y="198" width="18" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="148" y="224" width="28" height="7" rx="2" fill="#CBD5E1"/>
    <rect x="198" y="224" width="34" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="258" y="224" width="30" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="310" y="224" width="16" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="148" y="250" width="28" height="7" rx="2" fill="#CBD5E1"/>
    <rect x="198" y="250" width="38" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="258" y="250" width="22" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="310" y="250" width="20" height="7" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Checklist card -->
  <g filter="url(#ssSoftShadow)">
    <rect x="286" y="236" width="118" height="112" rx="14" fill="#FFFFFF" stroke="#DBEAFE"/>
    <text x="302" y="262" fill="#0F172A" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700">Sheets</text>

    <!-- checked row -->
    <rect x="302" y="274" width="16" height="16" rx="4" fill="#2563EB"/>
    <path d="M306.2 282.2l3 3 6.2-6.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="324" y="277" width="58" height="8" rx="2" fill="#CBD5E1"/>

    <!-- checked row -->
    <rect x="302" y="298" width="16" height="16" rx="4" fill="#2563EB"/>
    <path d="M306.2 306.2l3 3 6.2-6.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="324" y="301" width="48" height="8" rx="2" fill="#CBD5E1"/>

    <!-- unchecked row -->
    <rect x="302" y="322" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="324" y="325" width="54" height="8" rx="2" fill="#E2E8F0"/>
  </g>
</svg>
